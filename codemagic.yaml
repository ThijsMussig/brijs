workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    certificates:
      - certificate_url: ENCRYPTED_P12_URL    # Replace with your encrypted P12 URL
        certificate_password: ENCRYPTED_PASSWORD    # Replace with your encrypted password (if needed)
        provisioning_profile_url: ENCRYPTED_MOBILEPROVISION_URL   # Replace with your encrypted provisioning profile URL
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Build iOS app
        script: |
          flutter build ios --release
    artifacts:
      - build/ios/ipa

