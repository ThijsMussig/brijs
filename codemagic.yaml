workflows:
  ios-release:
    name: iOS Release with Signing
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_ID: "com.example.todoeyFlutter" # Change to your real bundle ID
    certificates:
      - certificate_url: ENCRYPTED_P12_URL
        certificate_password: ENCRYPTED_PASSWORD
        provisioning_profile_url: ENCRYPTED_MOBILEPROVISION_URL

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS
        script: |
          flutter build ios --release

    artifacts:
      - build/ios/ipa
